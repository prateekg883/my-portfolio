  <main>
    <section class="container section">
      <h1>Contact</h1>
      <div class="glass p-24 contact-form-wrap">
        <form id="contact-form" novalidate>
          <div class="form-row">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required minlength="2">
            <small class="error" id="err-name"></small>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <small class="error" id="err-email"></small>
          </div>

          <div class="form-row">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>
            <small class="error" id="err-subject"></small>
          </div>

          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required minlength="10"></textarea>
            <small class="error" id="err-message"></small>
          </div>

          <div class="form-row">
            <button type="submit" class="btn btn-primary">Send Message</button>
          </div>
        </form>

        <aside class="contact-info">
          <p><strong>Email</strong><br><a href="mailto:prateekg883@gmail.com">prateekg883@gmail.com</a></p>
          <p><strong>LinkedIn</strong><br><a href="https://www.linkedin.com/in/prateek-gupta-tech/" target="_blank" rel="noopener">linkedin.com/in/prateek-gupta-tech</a></p>
          <p><strong>GitHub</strong><br><a href="https://github.com/prateekg883" target="_blank" rel="noopener">github.com/prateekg883</a></p>
          <p><strong>Location</strong><br>Greater Noida, Uttar Pradesh</p>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© <span id="year4"></span> Prateek Gupta</div>
    </div>
  </footer>

  <script src="js/contact.js" defer></script>
  <script src="js/scroll.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
